<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>야룽짱부-브라마푸트라강 협상 회담</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0C1826;--navy2:#162B44;--red:#E63946;--yellow:#FFC83D;
  --bg:#ECEFF2;--surface:#FFFFFF;--sunk:#F3F5F7;--ink:#121A22;--muted:#5D6975;--line:#D5DBE1;
  --g:#1F7A8C;--r:#D23B3B;--ok:#1F8A57;
  --lv0:#C8372D;--lv1:#D9901C;--lv2:#2E8A57;--lv3:#2468B0;
  --display:"Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A121C;--surface:#132131;--sunk:#1A2B3D;--ink:#E8EDF2;--muted:#9BA9B6;--line:#26394E;--g:#3FA7BC;--r:#F06565;--ok:#46B37A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0A121C;--surface:#132131;--sunk:#1A2B3D;--ink:#E8EDF2;--muted:#9BA9B6;--line:#26394E;--g:#3FA7BC;--r:#F06565;--ok:#46B37A;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 100px)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;word-break:keep-all}
h1,h2,h3,p{margin:0}
.d{font-family:var(--display);font-weight:400;line-height:1.25;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.muted{color:var(--muted)}
.tag{display:inline-block;background:var(--red);color:#fff;font-weight:700;font-size:13px;padding:2px 10px;border-radius:3px}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--navy);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 18px;min-height:56px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--navy)}
.brand{font-family:var(--display);font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.brand em{font-style:normal;color:var(--red)}
.topbar .sp{margin-left:auto;display:flex;gap:8px;align-items:center}
.ghost{background:none;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:6px;padding:4px 10px;font-size:13px;white-space:nowrap}

/* map */
.mapbox{position:relative;width:100%;height:100%;overflow:hidden;background:#08111A}
.map{display:block;width:100%;height:100%}
.map text{font-family:var(--font);font-size:var(--fs,14px);fill:#fff;paint-order:stroke;stroke:rgba(4,10,14,.85);stroke-width:calc(var(--fs,14px)*.26);stroke-linejoin:round;pointer-events:none}
.map .tc{font-weight:700;letter-spacing:.3em}
.map .tr{fill:#F1E7C8;font-weight:500}
.map .ts{font-size:calc(var(--fs,14px)*.88)}
.map .border{fill:none;stroke:rgba(255,255,255,.75);stroke-width:1.3;stroke-dasharray:5 4;vector-effect:non-scaling-stroke}
.map .minor{fill:none;stroke:#8BDCEB;stroke-opacity:.5;stroke-width:1.2;vector-effect:non-scaling-stroke}
.map .lake{fill:#6FC6D8;fill-opacity:.85}
.map .seg{fill:none;stroke-width:4.2;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;transition:stroke .8s}
.map .flowline{fill:none;stroke:#fff;stroke-linecap:round;stroke-opacity:.9;pointer-events:none}
.map .dam .ring{fill:none;stroke:#FFD166;stroke-width:3;vector-effect:non-scaling-stroke}
@media (prefers-reduced-motion:no-preference){.map .dam .ring{animation:blink 2s ease-in-out infinite}}
@keyframes blink{50%{opacity:.25}}
.ov{position:absolute;inset:0;pointer-events:none}
.ov svg{position:absolute;inset:0;width:100%;height:100%}
.callout{position:absolute;background:rgba(12,24,38,.92);color:#fff;border:2px solid var(--yellow);border-radius:6px;padding:2px 10px;font-weight:700;font-size:15px;white-space:nowrap}
.secb{position:absolute;transform:translate(-50%,-50%);font-size:12px;font-weight:700;color:#fff;padding:1px 8px;border-radius:999px;white-space:nowrap;box-shadow:0 1px 6px rgba(0,0,0,.5)}
.rname{position:absolute;transform:translate(-50%,-50%);font-weight:700;font-size:14px;color:#BFF1FA;text-shadow:0 0 4px #000,0 0 8px #000;white-space:nowrap}
.rpin{position:absolute;transform:translate(-50%,-50%);width:38px;height:38px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.5);background:#fff}
.rpin svg{width:100%;height:100%;display:block;border-radius:50%}
.rpin.me{border-color:var(--yellow);box-shadow:0 0 0 4px rgba(255,200,61,.45),0 2px 8px rgba(0,0,0,.5);width:50px;height:50px}
.credit{position:absolute;right:8px;bottom:4px;font-size:11px;color:rgba(255,255,255,.7)}

/* home */
.hero{display:grid;grid-template-columns:380px minmax(0,1fr);background:var(--navy);color:#fff}
.hero .copy{padding:28px 26px;display:flex;flex-direction:column;gap:14px}
.hero h1{font-size:46px;line-height:1.12}
.hero h1 span{color:var(--yellow);display:block}
.hero .lead{font-size:17px;color:#D8E1EA}
.hero .mapcell{position:relative;aspect-ratio:1594/1158;max-height:82vh;width:100%}
.nums{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.num{border-left:4px solid var(--yellow);padding:4px 0 4px 10px}
.num b{display:block;font-family:var(--display);font-weight:400;font-size:24px;line-height:1.2}
.num small{color:#AFC0CF;font-size:13px}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:13px;color:#C9D5E0}
.legend i{display:inline-block;width:22px;height:5px;border-radius:3px;vertical-align:middle;margin-right:5px}
@media (max-width:980px){.hero{grid-template-columns:1fr}.hero .mapcell{max-height:none}.hero h1{font-size:36px}}
.qband{background:var(--yellow);color:#111;padding:16px 20px;text-align:center}
.qband small{font-weight:700;font-size:13px;display:block}
.qband .d{font-size:26px}
.wrap{max-width:1120px;margin:0 auto;padding:22px 16px;display:flex;flex-direction:column;gap:16px}
.narrow{max-width:680px}
.vcols{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
@media (max-width:860px){.vcols{grid-template-columns:1fr}}
.mapbox.sm .callout{font-size:11px;padding:0 6px;border-width:1.5px}
.mapbox.sm .rpin{width:28px;height:28px;border-width:2px}.mapbox.sm .rpin.me{width:36px;height:36px}
.mapbox.sm .secb{font-size:10px;padding:0 6px}.mapbox.sm .rname{font-size:11px}
.sec{font-family:var(--display);font-size:24px}
.sub{font-size:14px;color:var(--muted)}
.five{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
@media (max-width:980px){.five{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}}
.dcard{background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--rc);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.dcard header{display:flex;gap:10px;align-items:center}
.dcard svg{width:52px;height:52px;flex:none}
.dcard b{display:block;font-size:15px;line-height:1.35}
.dcard small{display:block;font-size:12px;color:var(--muted);line-height:1.4}
.dcard q{font-size:15px;font-weight:500}
.goals{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:15px}
.goals ol{margin:6px 0 0;padding-left:20px}
.joinbox{background:var(--navy);color:#fff;border-radius:14px;padding:20px;display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end}
.joinbox .label{color:#AFC0CF}
@media (max-width:700px){.joinbox{grid-template-columns:1fr}}
.field{width:100%;font:inherit;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
textarea.field{min-height:84px;resize:vertical}
.label{display:block;font-size:14px;color:var(--muted);margin-bottom:6px;font-weight:500}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:11px 18px;font-weight:700}
.btn.go{background:var(--red);border-color:var(--red);color:#fff}
.btn.dark{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.wide{width:100%;font-size:17px;padding:14px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.foot{text-align:center;padding:18px 16px 28px;font-size:12px;color:var(--muted)}
.foot button{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:12px}
.warn{background:#FFF3CD;color:#5A4300;border-radius:8px;padding:8px 12px;font-size:14px}

/* role pick */
.rolepick{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.rolepick button{display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--rc);border-radius:10px;padding:12px}
.rolepick svg{width:56px;height:56px}
.rolepick b{display:block;font-size:17px}
.rolepick span span{font-size:13px;color:var(--muted)}
.rolepick button:disabled{opacity:.4;cursor:not-allowed}

/* main */
.who{display:flex;align-items:center;gap:10px;min-width:0}
.who svg{width:38px;height:38px;flex:none}
.who b{display:block;font-size:15px;white-space:nowrap}
.who small{display:block;font-size:12px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;background:var(--navy2);overflow-x:auto;position:sticky;top:calc(env(safe-area-inset-top,0px) + 56px);z-index:19}
.tabs button{flex:1;min-width:max-content;border:0;background:none;color:#9FB1C4;padding:10px 14px;font-weight:700;font-size:14px;border-bottom:3px solid transparent}
.tabs button[aria-current="page"]{color:#fff;border-bottom-color:var(--yellow)}
.tabs button:disabled{opacity:.4;cursor:not-allowed}
.tabs b{font-family:var(--display);font-weight:400;margin-right:5px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.cols{grid-template-columns:1fr}}
.speech{display:flex;gap:12px;align-items:flex-start}
.speech svg{width:64px;height:64px;flex:none}
.bub{background:var(--surface);border:2px solid var(--rc);border-radius:14px;padding:12px 14px;font-size:16px;white-space:pre-line;position:relative}
.secret{border:2px dashed var(--r);border-radius:12px;padding:14px;background:var(--surface)}
.secret .gl{font-family:var(--display);font-size:21px;margin:6px 0}
.future{background:color-mix(in srgb,var(--ok) 12%,var(--surface));border-left:4px solid var(--ok);padding:8px 12px;border-radius:6px;font-size:15px}
.first{font-family:var(--display);font-size:24px}
.minimap{aspect-ratio:1594/1158;border-radius:12px;overflow:hidden}
.qh{font-size:17px;font-weight:700;margin-bottom:8px}
.qh small{font-weight:500;color:var(--muted);font-size:13px;margin-left:6px}
.qn{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:4px;background:var(--navy);color:#fff;font-size:13px;margin-right:6px;vertical-align:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:15px}
.chips button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.ev{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.evc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.evc .src{display:flex;gap:6px;flex-wrap:wrap}
.evc .src span{font-size:12px;font-weight:700;border:1px solid var(--g);color:var(--g);border-radius:4px;padding:0 7px}
.evc .src span.t{border-color:var(--muted);color:var(--muted);font-weight:500}
.evc p{font-size:15px}
.evc .two{margin-top:auto}
.evc h4{margin:0;font-size:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.two button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 6px;font-weight:700;font-size:14px}
.two button[aria-pressed="true"].g{background:var(--g);border-color:var(--g);color:#fff}
.two button[aria-pressed="true"].r{background:var(--r);border-color:var(--r);color:#fff}
.doc{background:#FFFDF8;color:#1B1B1B;border:1px solid #E4DCC8;border-radius:6px;padding:22px;box-shadow:0 4px 18px rgba(0,0,0,.08);font-size:15px}
.doc h3{font-family:var(--display);font-weight:400;font-size:22px}
.doc .m{font-size:12px;color:#7A7266;margin-bottom:10px}
.doc .f{font-family:var(--display);font-size:19px;margin:6px 0}
.doc .k{font-weight:700;font-size:13px;margin-top:10px}
.doc ul{margin:2px 0 0;padding-left:18px}
.doc .ph{color:#A79F92}
@media (min-width:861px){.sticky-col{position:sticky;top:120px}}
.okmsg{font-size:14px;color:var(--ok);font-weight:700;text-align:center}
/* compare */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.pc{background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--rc);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px}
.pc.me{box-shadow:0 0 0 3px var(--yellow)}
.pc header{display:flex;gap:8px;align-items:center}
.pc header svg{width:40px;height:40px;flex:none}
.pc .f{font-family:var(--display);font-size:18px;line-height:1.35}
.pc .meta{font-size:13px;color:var(--muted)}
.pc.wait{align-items:center;justify-content:center;color:var(--muted);min-height:130px}
table.rd{width:100%;border-collapse:separate;border-spacing:4px;table-layout:fixed}
.rd th{font-size:13px;font-weight:700;text-align:center;padding:4px}
.rd th.rh{text-align:left;width:32%;font-weight:500}
.rd th.rh b{display:block;font-size:14px}
.rd th.rh small{color:var(--muted)}
.rd td{height:44px;border-radius:6px;text-align:center;font-weight:700;font-size:13px;background:var(--sunk);color:var(--muted)}
.rd td.g{background:var(--g);color:#fff}.rd td.r{background:var(--r);color:#fff}
.rd tr.split th.rh b::after{content:" 갈림";font-size:11px;background:var(--yellow);color:#111;border-radius:3px;padding:0 5px;margin-left:4px;vertical-align:1px}
.ask{background:var(--yellow);color:#111;border-radius:12px;padding:14px 16px;font-weight:700}
/* vote */
.rtabs{display:flex;gap:6px}
.rtabs button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 14px;font-weight:700;font-size:14px}
.rtabs button[aria-current="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.rtabs button:disabled{opacity:.4}
.banner{border-radius:12px;overflow:hidden}
.banner .top{background:var(--red);color:#fff;font-weight:700;padding:6px 14px;font-size:14px}
.banner .h{background:var(--navy);color:#fff;font-family:var(--display);font-size:24px;padding:10px 14px 12px;line-height:1.3}
.bigq{font-family:var(--display);font-size:30px}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:40px 1fr;gap:10px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px}
.opt .k{font-family:var(--display);font-size:30px;line-height:1}
.opt[aria-pressed="true"]{border-color:var(--navy);box-shadow:0 0 0 2px var(--navy)}
.fx{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.fx span{font-size:12px;font-weight:700;border:1px solid var(--line);border-radius:4px;padding:0 6px}
.fx .u{color:var(--ok)}.fx .dn{color:var(--r)}
.mine{font-size:12px;font-weight:700;color:#fff;background:var(--navy);border-radius:3px;padding:0 6px;margin-left:6px}
.state{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.state h3{font-size:17px;margin-bottom:8px}
.meter{margin:8px 0}
.meter .row{display:flex;justify-content:space-between;align-items:center;font-size:14px}
.meter .bar{position:relative;height:10px;background:var(--sunk);border-radius:5px;overflow:hidden;margin-top:3px}
.meter .bar i{position:absolute;inset:0 auto 0 0;border-radius:5px;transition:width .6s}
.meter .bar s{position:absolute;top:0;bottom:0;width:1px;background:var(--ink);opacity:.2}
.lv{display:inline-block;font-size:12px;font-weight:700;color:#fff;border-radius:3px;padding:0 7px}
.lv0{background:var(--lv0)}.lv1{background:var(--lv1)}.lv2{background:var(--lv2)}.lv3{background:var(--lv3)}
.goalbox{border:2px dashed var(--r);border-radius:10px;padding:10px 12px;margin-top:12px;font-size:14px}
.goalbox .y{color:var(--ok);font-weight:700}.goalbox .n{color:var(--r);font-weight:700}
.board{background:var(--navy);color:#fff;border-radius:12px;padding:14px 16px}
.brow{display:grid;grid-template-columns:28px 1fr 46px;gap:8px;align-items:center;margin:6px 0}
.brow .k{font-family:var(--display);font-size:20px}
.brow .bar{height:20px;background:rgba(255,255,255,.12);border-radius:4px;position:relative;overflow:hidden}
.brow .bar i{position:absolute;inset:0 auto 0 0;background:#4FD3EE;transition:width .8s}
.brow.win .bar i{background:var(--yellow)}
.brow .n{font-family:var(--display);font-size:20px;text-align:right}
.brow .vs{grid-column:2/4;display:flex;gap:4px}
.brow .vs svg{width:24px;height:24px}
.stamp{display:inline-block;border:3px solid var(--yellow);color:var(--yellow);font-family:var(--display);padding:0 10px;transform:rotate(-3deg);font-size:18px;margin-right:8px}
/* result */
.gtab{display:grid;gap:6px}
.gtab div{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px}
.gtab svg{width:36px;height:36px}
.gtab .y{color:var(--ok);font-weight:700}.gtab .n{color:var(--r);font-weight:700}
.verdict{background:var(--red);color:#fff;border-radius:12px;padding:16px 18px}
.verdict .d{font-size:24px}
.finalq{background:var(--yellow);color:#111;border-radius:12px;padding:16px}
.finalq .d{font-size:21px;line-height:1.4}
.tri{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tri button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 4px;font-weight:700;font-size:14px}
.tri button[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.lesson{background:var(--navy);color:#fff;border-radius:12px;padding:18px}
.lesson .d{font-size:22px;line-height:1.45;margin:6px 0}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);padding:20px;max-width:360px}
dialog::backdrop{background:rgba(0,0,0,.5)}
#rec{position:fixed;left:-9999px;top:0;width:760px;background:#fff;color:#111;font-family:var(--font);padding:40px;font-size:14px;line-height:1.6}
#rec h1{font-family:var(--display);font-weight:400;font-size:28px}
#rec h2{font-size:16px;margin:18px 0 6px;border-bottom:2px solid #111;padding-bottom:3px}
#rec .m{color:#555;font-size:12px}
#rec table{width:100%;border-collapse:collapse;font-size:13px}
#rec td,#rec th{border:1px solid #ccc;padding:4px 6px;text-align:left}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="rec" aria-hidden="true"></div>

    if(v==='full'){vb=[0,0,GEO.w,GEO.h]}else{let c,w;if(Array.isArray(v)){c=proj(v[0],v[1]);w=v[2]}else{const b=GEO.boxes[v];c=[b[0]+b[2]/2,b[1]+b[3]/2];w=b[2]}
      const h=w*ch/cw;let x=c[0]-w/2,y=c[1]-h/2;x=Math.max(0,Math.min(GEO.w-w,x));y=Math.max(0,Math.min(GEO.h-h,y));vb=[x,y,w,h]}
    svg.setAttribute('viewBox',vb.join(' '));sizes();place()}
  function sizes(){const cw=box.clientWidth||800,ch=box.clientHeight||600;const sc=Math.max(vb[2]/cw,vb[3]/ch);const fs=(cw<500?11:14)*sc;svg.style.setProperty('--fs',fs+'px');M.u=sc;flow.setAttribute('stroke-width',2.2*sc);flow.setAttribute('stroke-dasharray',`${2.5*sc} ${14*sc}`)}
  function place(){const m=svg.getScreenCTM();if(!m)return;const r=box.getBoundingClientRect();const small=box.clientWidth<520;
    items.forEach(it=>{const pt=svg.createSVGPoint();pt.x=it.x;pt.y=it.y;const q=pt.matrixTransform(m);const ax=q.x-r.left,ay=q.y-r.top;
      const k=small?.6:1;let bx=ax+it.dx*k,by=ay+it.dy*k;
      if(it.line){const w=it.el.offsetWidth,h=it.el.offsetHeight;bx=Math.max(4,Math.min(box.clientWidth-w-4,bx));by=Math.max(4,Math.min(box.clientHeight-h-4,by));it.el.style.left=bx+'px';it.el.style.top=by+'px';
        const cx=Math.max(bx,Math.min(bx+w,ax)),cy=Math.max(by,Math.min(by+h,ay));it.ln.setAttribute('x1',ax);it.ln.setAttribute('y1',ay);it.ln.setAttribute('x2',cx);it.ln.setAttribute('y2',cy);it.dot.setAttribute('cx',ax);it.dot.setAttribute('cy',ay)}
      else{it.el.style.left=bx+'px';it.el.style.top=by+'px'}})}
  const M={box,u:1};
  M.colorSections=map=>{svg.querySelectorAll('.seg').forEach(p=>{const c=map&&map[p.dataset.s];p.style.stroke=c||SEGC[p.dataset.s]})};
  let off=0,last=0;
  function loop(now){const dt=Math.min(64,now-(last||now));last=now;if(!RM&&flen){off-=dt*0.035*M.u;flow.setAttribute('stroke-dashoffset',off)}if(box.isConnected)requestAnimationFrame(loop)}
  requestAnimationFrame(loop);
  new ResizeObserver(setView).observe(box);
  requestAnimationFrame(setView);
  return M;
}

    if(f.claim!==undefined&&document.activeElement!==$('#fc'))d.claim=f.claim;if(f.reply!==undefined&&document.activeElement!==$('#fr'))d.reply=f.reply;refresh(g2.submitted)};
}

/* 3 입장 비교 */
function pCompare(mb,g){
  function draw(){
    const n=ORDER.filter(r=>formOf(r)).length;
    mb.innerHTML=`<div class="wrap"><div><h2 class="sec">입장 비교</h2><p class="sub">각 대표단이 입장문을 30초씩 읽는다. ${n}/5 대표단 제출 · 새 입장문이 들어오면 바로 나타난다.</p></div>
    <div class="pgrid">${ORDER.map(r=>{const f=formOf(r),R=ROLES[r];if(!f)return `<article class="pc wait" style="--rc:${R.c}">${avatar(R.av).replace('<svg','<svg style="width:44px;height:44px"')}<b>${R.team}</b><span>입장문 작성 중…</span></article>`;
      return `<article class="pc ${r===g.role?'me':''}" style="--rc:${R.c}"><header>${avatar(R.av)}<b>${R.team}</b></header><p class="f">${R.first}</p><p>${esc(f.claim)}</p><p class="meta">가치: ${(f.values||[]).map(esc).join(', ')}<br>지형: ${(f.ters||[]).map(esc).join(', ')}</p></article>`}).join('')}</div>
    <div class="card"><p class="qh">같은 자료, 다른 해석</p><div style="overflow-x:auto"><table class="rd"><thead><tr><th class="rh"></th>${ORDER.map(r=>`<th style="color:${ROLES[r].c}">${ROLES[r].short}</th>`).join('')}</tr></thead><tbody>
    ${EVID.map(e=>{const vs=ORDER.map(r=>{const f=formOf(r);return f&&f.cls?f.cls[e.id]:null});const split=vs.includes('g')&&vs.includes('r');
      return `<tr class="${split?'split':''}"><th class="rh"><b>${e.title}</b><small>${e.ter} · ${e.kind} ${e.src}</small></th>${vs.map(v=>`<td class="${v||''}">${v==='g'?'근거':v==='r'?'반박':'·'}</td>`).join('')}</tr>`}).join('')}
    </tbody></table></div><p class="sub" style="margin-top:6px"><b style="color:var(--g)">근거</b>로 읽은 대표단과 <b style="color:var(--r)">반박</b>할 공격으로 읽은 대표단</p></div>
    <p class="ask">같은 자료를 누구는 근거로, 누구는 공격으로 읽었다. 그 대표단은 강의 어디에 사는가?</p>
    <button class="btn dark wide" id="next">회담 투표로 ▶</button></div>`;
    $('#next').onclick=()=>go('vote');
  }
  draw();let sig=JSON.stringify(ORDER.map(formOf));
  return ()=>{const s=JSON.stringify(ORDER.map(formOf));if(s!==sig&&!isTyping(mb)){sig=s;const y=scrollY;draw();scrollTo(0,y)}};
}

/* 4 회담 투표 */
function metersHTML(base,prev,goal){
  return MK.map(k=>{const [ic,nm,col]=METER[k];const b=base[k],p=prev?prev[k]:b;const isG=goal==='X'?k==='D':goal===k;
    const lo=Math.min(b,p),hi=Math.max(b,p),ch=p!==b;
    return `<div class="meter"><div class="row"><span>${ic} ${nm}${isG?'<span class="mine">우리 목표</span>':''}</span><span>${ch?`<span class="lv lv${lv(b)}">${LVN[lv(b)]}</span> → `:''}<span class="lv lv${lv(p)}">${LVN[lv(p)]}</span>${ch?` <b style="font-size:12px;color:${p>b?'var(--ok)':'var(--r)'}">${p>b?'+':''}${p-b}</b>`:''}</span></div><div class="bar"><i style="width:${lo}%;background:${col}"></i>${ch?`<i style="left:${lo}%;width:${hi-lo}%;background:repeating-linear-gradient(45deg,${p>b?col:'#999'} 0 5px,transparent 5px 9px);outline:2px solid ${p>b?col:'var(--r)'};outline-offset:-2px"></i>`:''}<s style="left:25%"></s><s style="left:50%"></s><s style="left:75%"></s></div></div>`}).join('')}
function pVote(mb,g){
  const myv=g.votes||{};if(round==='r2'&&!myv.r1)round='r1';
  const R=ROUNDS[round],rk=round,idx=R.n,role=g.role;
  let sel=myv[rk]||null;
  mb.innerHTML=`<div class="wrap"><div class="rtabs">${RK.map(k=>`<button data-r="${k}" ${round===k?'aria-current="true"':''}>${ROUNDS[k].n}라운드${(g.votes||{})[k]?' ✓':''}</button>`).join('')}</div>
  <div class="cols vcols"><div style="display:flex;flex-direction:column;gap:12px">
   <div class="banner"><div class="top">${R.top}</div><div class="h">${R.head}</div></div>
   <p class="bigq">${R.q}</p>
   <p class="sub">우리 대표단은 이번 라운드에 <b>${weight(role)}표</b>. 선택지를 누르면 ‘강의 상태’에 그 안이 결정될 때의 변화가 바로 나타난다.</p>
   <div class="opts">${['A','B','C'].map(k=>{const [t,fx]=R.opts[k];return `<button class="opt" data-v="${k}"><span class="k">${k}</span><span>${t}<span class="fx">${MK.filter(m=>fx[m]).map(m=>`<span class="${fx[m]>0?'u':'dn'}">${METER[m][0]} ${METER[m][1]} ${fx[m]>0?'+':''}${fx[m]}</span>`).join('')}</span></span></button>`}).join('')}</div>
   <button class="btn go wide" id="cast"></button>
   <div id="res"></div>
  </div><div class="sticky-col"><div class="state"><h3>강의 상태</h3><div id="mt"></div><p class="sub">위기 · 불안 · 안정 · 최상. 하나라도 ‘위기’면 강은 지속될 수 없다.</p>
   <div class="goalbox"><b>우리의 비밀 목표</b><br>${ROLES[role].goalTxt}<div id="gs" style="margin-top:4px"></div></div></div></div></div></div>`;
  function base(){return idx===1?{...START}:stateAfter(1)}
  function drawMeters(){const b=base();const p=sel?applyFx(b,R.opts[sel][1]):null;$('#mt').innerHTML=metersHTML(b,p,ROLES[role].goal);
    const tgt=p||b;const ok=goalMet(role,tgt);$('#gs').innerHTML=`<span class="${ok?'y':'n'}">${sel?sel+'안이 결정되면':'지금 상태로는'}: ${ok?'목표 달성':'목표 실패'}</span>`}
  function drawOpts(g2){mb.querySelectorAll('.opt').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===sel));const voted=((g2||myGroup()).votes||{})[rk];
    const c=$('#cast');c.disabled=!sel||sel===voted;c.textContent=voted?(sel===voted?`${voted}안에 투표했다`:`${sel}안으로 투표 바꾸기`):(sel?`${sel}안에 투표하기`:'선택지를 고르자')}
  function drawRes(){const r=result(rk);const box=$('#res');const voted=(myGroup().votes||{})[rk];
    if(!voted){box.innerHTML='';return}
    if(r.pending){box.innerHTML=`<div class="board"><b>개표 대기</b> · ${r.n}/${r.N} 대표단 투표. 모든 대표단이 투표하면 결과가 발표된다.</div>`;return}
    const max=Math.max(1,r.c.A+r.c.B+r.c.C);
    box.innerHTML=`<div class="board">${['A','B','C'].map(k=>`<div class="brow ${r.choice===k?'win':''}"><span class="k">${k}</span><div class="bar"><i style="width:${r.c[k]/max*100}%"></i></div><span class="n">${r.c[k]}표</span><div class="vs">${r.who[k].map(x=>avatar(ROLES[x].av)).join('')}</div></div>`).join('')}
      <p style="margin-top:8px">${r.choice?`<span class="stamp">${r.choice}안 결정</span>`:'<span class="stamp">결정 보류</span>'}${r.note?esc(r.note):''}</p></div>
      ${idx===1?'<button class="btn dark wide" id="nx">2라운드로 ▶</button>':'<button class="btn go wide" id="nx">회담 결과 보기 ▶</button>'}`;
    $('#nx').onclick=()=>{if(idx===1){round='r2';ls.set('yt-round',round);view.key=null;render();scrollTo(0,0)}else go('end')}}
  mb.querySelectorAll('.rtabs button').forEach(b=>b.onclick=()=>{if(b.dataset.r==='r2'&&!(myGroup().votes||{}).r1)return;round=b.dataset.r;ls.set('yt-round',round);view.key=null;render()});
  mb.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{sel=b.dataset.v;drawOpts();drawMeters()});
  $('#cast').onclick=()=>{if(sel)saveGroup(me.key,{votes:{[rk]:sel}})};
  drawOpts(g);drawMeters();drawRes();
  const r2=mb.querySelector('.rtabs button[data-r="r2"]');r2.disabled=!myv.r1;
  let sig='';return g2=>{const s=JSON.stringify([g2.votes,RK.map(result)]);if(s===sig)return;sig=s;drawOpts(g2);drawMeters();drawRes();const b2=mb.querySelector('.rtabs button[data-r="r2"]');if(b2)b2.disabled=!(g2.votes||{}).r1};
}

/* 5 회담 결과 */
function pEnd(mb,g){
  const M=stateAfter(2);const role=g.role;
  const sid=me.key+'_'+hash(me.name);const mine=RF[sid];
  const d={judge:null,text:'',...(mine||{})};
  const all=ORDER.filter(r=>activeRoles().includes(r));
  const met=all.filter(r=>goalMet(r,M)).length;
  const colOf=k=>({0:'#E2483D',1:'#F0A030',2:'#3FBF7A',3:'#4FA3F0'})[lv(M[k])];
  mb.innerHTML=`<div class="wrap"><div><h2 class="sec">회담 결과 · 우리가 만든 2050년</h2><p class="sub">1라운드 ${result('r1').choice||'보류'}안 · 2라운드 ${result('r2').choice||'보류'}안</p></div>
  <div class="cols"><div><div class="minimap" id="mm"></div><p class="sub" style="margin-top:6px">강의 색: 상류 = 삶터·성지, 대협곡 = 재난 안전, 중류 = 하류 물 안정, 하류 = 퇴적물·모래섬의 상태</p></div>
  <div class="state"><h3>2050년 강의 상태</h3>${metersHTML(M,null,ROLES[role].goal)}</div></div>
  <div><p class="qh">비밀 목표 공개</p><div class="gtab">${all.map(r=>{const ok=goalMet(r,M);return `<div>${avatar(ROLES[r].av)}<span><b>${ROLES[r].team}</b> · ${ROLES[r].goalTxt}<br><span class="sub">${ok?ROLES[r].win:ROLES[r].lose}</span></span><span class="${ok?'y':'n'}">${ok?'달성':'실패'}</span></div>`}).join('')}</div></div>
  <div class="verdict"><p class="d">${all.length} 대표단 중 ${met}곳만 목표를 이뤘다.</p><p style="margin-top:6px">어떤 조합으로 투표해도 다섯 대표단이 모두 목표를 이룰 수는 없다. 상류에서 낙차를 최대로 쓰면, 하류의 모래섬과 협곡의 삶터가 줄어든다.</p></div>
  <div class="finalq"><p class="d">이 갈등은 단순히 정보가 부족해서 발생하는가, 아니면 각 집단이 추구하는 가치와 이해관계가 달라서 발생하는가?</p><p style="margin-top:6px;font-weight:700">지형의 특성과 공간적 관계를 근거로 설명하라. (개인 · ${esc(me.name)})</p></div>
  <div class="card"><div class="tri" id="jd"><button data-v="정보 부족">정보 부족</button><button data-v="가치·이해관계 차이">가치·이해관계 차이</button><button data-v="둘 다">둘 다</button></div>
  <textarea class="field" id="tx" style="margin-top:10px" maxlength="400" placeholder="예: 큰 낙차는 상류의 중국에게는 ……이지만, 하류의 방글라데시에게는 …… 그래서 ……"></textarea>
  <button class="btn go wide" id="ns" style="margin-top:10px"></button></div>
  <div id="after"></div></div>`;
  const m=createMap({view:'basin'});$('#mm').appendChild(m.box);m.colorSections({up:colOf('L'),gorge:colOf('D'),mid:colOf('W'),low:colOf('S')});
  const ok=()=>d.judge&&d.text.trim().length>=20;
  function refresh(){mb.querySelectorAll('#jd button').forEach(b=>b.setAttribute('aria-pressed',d.judge===b.dataset.v));const n=$('#ns');n.disabled=!ok();n.textContent=RF[sid]?'성찰 다시 제출':'성찰 제출하기';drawAfter()}
  function drawAfter(){const box=$('#after');if(!RF[sid]){box.innerHTML='';return}
    box.innerHTML=`<div class="lesson"><span class="tag">오늘의 정리</span><p class="d">같은 지형이 강의 어디에 사느냐에 따라 누군가에게는 개발의 기회, 누군가에게는 위협이 된다.</p><p>지형이 주는 자원과 개발의 영향은 지역과 집단마다 다르게 나타나고, 각 집단이 중요하게 여기는 가치와 감수할 수 있는 위험도 다르다. 그래서 정보를 모두 공개해도 갈등은 쉽게 풀리지 않는다.</p></div>
    <button class="btn dark wide" id="pdf">우리 대표단 기록 문서 (PDF)</button><p class="sub" id="pdfmsg" style="text-align:center"></p>`;
    $('#pdf').onclick=makePDF}
  mb.querySelectorAll('#jd button').forEach(b=>b.onclick=()=>{d.judge=b.dataset.v;refresh()});
  const tx=$('#tx');tx.value=d.text;tx.oninput=()=>{d.text=tx.value;$('#ns').disabled=!ok()};
  $('#ns').onclick=()=>{saveRef(sid,{role,name:me.name,code:me.code,judge:d.judge,text:d.text.trim(),at:Date.now()});refresh();$('#after').scrollIntoView({behavior:RM?'auto':'smooth'})};
  refresh();
  return ()=>{};
}

/* PDF 기록 문서 */
function loadScript(src){return new Promise((res,rej)=>{if(document.querySelector(`script[src="${src}"]`))return res();const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
async function makePDF(){
  const msg=$('#pdfmsg');msg.textContent='문서를 만드는 중…';
  const g=myGroup(),R=ROLES[g.role],f=g.form||{},M=stateAfter(2),sid=me.key+'_'+hash(me.name),rf=RF[sid]||{};
  const rec=$('#rec');
  rec.innerHTML=`<h1>${R.team} 회담 기록</h1><p class="m">${esc(g.code||me.code)} · ${Object.values(g.members||{}).map(esc).join(', ')} · 야룽짱부-브라마푸트라강 협상 회담</p>
  <h2>1. 입장문</h2><p style="font-family:var(--display);font-size:18px">${R.first}</p><p>${esc(f.claim||'')}</p>
  <p><b>가치</b> ${(f.values||[]).map(esc).join(', ')} · <b>지형적 근거</b> ${(f.ters||[]).map(esc).join(', ')}</p>
  <p><b>예상 반론에 대한 대답</b> ${esc(f.reply||'')}</p>
  <table><tr><th>자료</th><th>관련 지형</th><th>우리의 분류</th></tr>${EVID.map(e=>`<tr><td>${e.title} (${e.kind} · ${e.src})</td><td>${e.ter}</td><td>${(f.cls||{})[e.id]==='g'?'우리의 근거':(f.cls||{})[e.id]==='r'?'반박·대응':''}</td></tr>`).join('')}</table>
  <h2>2. 회담 투표</h2><table><tr><th>라운드</th><th>쟁점</th><th>우리의 선택</th><th>회담 결정</th></tr>${RK.map(k=>`<tr><td>${ROUNDS[k].n}</td><td>${ROUNDS[k].q}</td><td>${(g.votes||{})[k]||''}안</td><td>${result(k).choice||'보류'}안</td></tr>`).join('')}</table>
  <h2>3. 2050년 강의 상태</h2><table><tr>${MK.map(k=>`<th>${METER[k][1]}</th>`).join('')}</tr><tr>${MK.map(k=>`<td>${LVN[lv(M[k])]} (${M[k]})</td>`).join('')}</tr></table>
  <p><b>우리의 비밀 목표</b> ${R.goalTxt} → ${goalMet(g.role,M)?'달성':'실패'}</p>
  <h2>4. 나의 성찰 · ${esc(me.name)}</h2><p><b>판단</b> ${esc(rf.judge||'')}</p><p>${esc(rf.text||'')}</p>`;
  try{
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
    if(document.fonts&&document.fonts.ready)await document.fonts.ready;
    const canvas=await window.html2canvas(rec,{scale:2,backgroundColor:'#ffffff',windowWidth:840});
    const {jsPDF}=window.jspdf;const pdf=new jsPDF({unit:'mm',format:'a4'});
    const pw=210,ph=297,iw=pw,ih=canvas.height*iw/canvas.width;const img=canvas.toDataURL('image/jpeg',.92);
    let y=0;pdf.addImage(img,'JPEG',0,0,iw,ih);while(ih-y>ph){y+=ph;pdf.addPage();pdf.addImage(img,'JPEG',0,-y,iw,ih)}
    const blob=pdf.output('blob');const name=`${R.team}_${g.code||me.code}_${me.name}_회담기록.pdf`;
    if(dl){await dl.save({filename:name,data:blob});msg.textContent='저장했다.'}
    else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();msg.textContent='저장했다.'}
  }catch(e){msg.textContent=e&&e.code==='declined'?'저장을 취소했다.':'PDF를 만들지 못했다. 다시 눌러 보자.'}
}

/* ============ 시작 ============ */
function confirmDlg(msg,yes){const d=$('#dlg');$('#dlg-msg').textContent=msg;$('#dlg-yes').onclick=()=>{d.close();yes()};$('#dlg-no').onclick=()=>d.close();d.showModal?d.showModal():confirm(msg)&&yes()}
render();connect();
})();
</script>
</body>
</html>
